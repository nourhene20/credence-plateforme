<div class="header">
<nav class="navbar" [class.scrolled]="isScrolled">
  <div class="navbar-container">
    <ul class="nav-menu">
      <li *ngFor="let item of navItems" class="nav-item">
        <a 
          routerLink="{{ item.path }}" 
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
          class="nav-link"
          (click)="closeMenu()"
        >
          <span class="nav-icon">{{ item.icon }}</span>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      </li>
    </ul>
    <button class="nav-toggle" (click)="toggleMenu()" aria-label="Toggle navigation">
      <span class="hamburger-icon" [class.active]="isMenuOpen">
        <span></span>
        <span></span>
        <span></span>
      </span>
    </button>

  </div>
  <div class="mobile-menu" [class.open]="isMenuOpen">
    <ul class="mobile-nav-items">
      <li *ngFor="let item of navItems" class="mobile-nav-item">
        <a 
          routerLink="{{ item.path }}" 
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
          class="mobile-nav-link"
          (click)="closeMenu()"
        >
          <span class="nav-icon">{{ item.icon }}</span>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      </li>
    </ul>
  </div>
</nav>
  <div class="logo">
    <span class="logo-icon">🧠</span>
    <span class="logo-text">CREDENCE</span>
  </div>
  <p class="subtitle">Decompose epistemic and aleatoric uncertainty</p>
</div>
